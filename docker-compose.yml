version: '3.8'

services:
  # ============================================================================
  # AEGISOS Backend API Service (FastAPI)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisos-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Supabase Integration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

      # AI Intelligence Providers
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}

      # Backend Core Settings
      - SECRET_KEY=${SECRET_KEY}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - RATE_LIMIT=${RATE_LIMIT:-60/minute}
      - DEBUG=${DEBUG:-true}
    volumes:
      # Live development hot-reloading
      - ./backend:/app
      # Exclude container-specific bytecode and cache
      - /app/__pycache__
      - /app/.pytest_cache
    networks:
      - aegisos-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # AEGISOS Frontend Application (Next.js)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegisos-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      # Live development hot-reloading
      - ./frontend:/app
      # Prevent host node_modules and .next from overriding container builds
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - aegisos-network

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  aegisos-network:
    name: aegisos-network
    driver: bridge
